
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>ZADX STORE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}
header{padding:22px 16px;background:#111;border-bottom:1px solid #b58b35;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:23px;font-weight:bold;color:#e5b84c}
.logo span{color:white}
.cart{background:#e5b84c;color:#111;padding:10px 14px;border-radius:10px;font-weight:bold}
.hero{text-align:center;padding:55px 18px 45px;background:linear-gradient(140deg,#17130a,#090909 65%)}
.hero h1{font-size:34px;margin:0 0 14px;color:#e5b84c}
.hero p{color:#bbb;line-height:1.8}
.btn{display:inline-block;background:#d9aa3e;color:#111;padding:13px 23px;border:0;border-radius:9px;font-weight:bold;text-decoration:none;margin-top:12px;cursor:pointer}
.section{padding:25px 16px}
.section h2{color:#e5b84c;margin-bottom:20px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.product{background:#171717;border:1px solid #302719;border-radius:13px;padding:15px}
.product .symbol{font-size:30px;margin-bottom:12px}
.product h3{font-size:16px;margin:5px 0 10px}
.product p{font-size:13px;color:#aaa;line-height:1.6;min-height:40px}
.price{color:#e5b84c;font-weight:bold;margin:12px 0}
.product button{width:100%;padding:11px;border:0;border-radius:8px;background:#d9aa3e;font-weight:bold}
.cartbox{margin:16px;background:#171717;border:1px solid #80632e;border-radius:13px;padding:18px}
.cartbox h2{color:#e5b84c}
.cart-item{padding:9px 0;border-bottom:1px solid #333}
footer{text-align:center;padding:25px;color:#888;border-top:1px solid #292929}
.empty{color:#999}
</style>
</head>
<body>

<header>
<div class="logo">ZADX <span>STORE</span></div>
<div class="cart">🛒 <span id="count">0</span></div>
</header>

<section class="hero">
<h1>مرحبا بك في ZADX STORE</h1>
<p>وجهتك للخدمات الرقمية والبوتات والحلول الإلكترونية<br>جودة، احترافية وسهولة في الطلب</p>
<a href="#products" class="btn">اكتشف خدماتنا</a>
</section>

<section class="section" id="products">
<h2>⭐ خدماتنا الرقمية</h2>
<div class="products" id="productList"></div>
</section>

<section class="cartbox">
<h2>🛒 سلة الطلبات</h2>
<div id="cartItems"><p class="empty">السلة فارغة حالياً</p></div>
<button class="btn" onclick="sendOrder()">إرسال الطلب عبر تيليغرام</button>
</section>

<footer>
<p>© 2026 ZADX STORE</p>
<p>جميع الحقوق محفوظة</p>
<a class="btn" href="https://t.me/ZADX_PRO">تواصل معنا</a>
</footer>

<script>
const products=[
{name:"بوتات تيليغرام",desc:"بوتات مخصصة حسب احتياجاتك",price:"حسب الطلب",icon:"🤖"},
{name:"خدمات رقمية",desc:"حلول وخدمات إلكترونية متنوعة",price:"حسب الطلب",icon:"💻"},
{name:"تصميم احترافي",desc:"تصميمات وشعارات رقمية",price:"حسب الطلب",icon:"🎨"},
{name:"إعداد البوتات",desc:"مساعدة في إعداد وتشغيل البوتات",price:"حسب الطلب",icon:"⚙️"}
];

let cart=[];

function showProducts(){
document.getElementById("productList").innerHTML=products.map((p,i)=>`
<div class="product">
<div class="symbol">${p.icon}</div>
<h3>${p.name}</h3>
<p>${p.desc}</p>
<div class="price">${p.price}</div>
<button onclick="addToCart(${i})">إضافة إلى السلة</button>
</div>`).join("");
}

function addToCart(i){
cart.push(products[i]);
showCart();
}

function showCart(){
document.getElementById("count").textContent=cart.length;
const box=document.getElementById("cartItems");
if(!cart.length){
box.innerHTML='<p class="empty">السلة فارغة حالياً</p>';
return;
}
box.innerHTML=cart.map((p,i)=>`
<div class="cart-item">${p.icon} ${p.name}
<button onclick="removeItem(${i})" style="float:left;background:#9d3434;color:white;border:0;padding:5px 9px;border-radius:5px">حذف</button>
</div>`).join("");
}

function removeItem(i){
cart.splice(i,1);
showCart();
}

function sendOrder(){
if(!cart.length){
alert("أضف خدمة إلى السلة أولاً");
return;
}
const details=cart.map(p=>"• "+p.name).join("\n");
const message="السلام عليكم، أريد طلب الخدمات التالية من ZADX STORE:\n"+details;
const url="https://t.me/share/url?url="+encodeURIComponent("https://aminhamidd1999-del.github.io/zadx_store/")+"&text="+encodeURIComponent(message);
window.open(url,"_blank");
}

showProducts();
</script>
</body>
</html>
